name: Basic CI/CD Pipeline (Entry Tier)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Security best practice: Least privilege token permissions
permissions:
  contents: read

jobs:
  pipeline:
    name: Quality Checks, Tests, Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6.3.0
        with:
          python-version: '3.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install Dependencies
        working-directory: backend
        run: |
          uv sync --frozen --no-editable --no-install-project

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: 1a. Ruff Format Check
        working-directory: backend
        run: |
          uv run ruff format --check . > ../reports/ruff-format.txt 2>&1 || echo "format_failed=true" >> $GITHUB_ENV

      - name: 1b. Ruff Lint Check
        working-directory: backend
        run: |
          uv run ruff check . --output-format=text > ../reports/ruff-lint.txt 2>&1 || echo "lint_failed=true" >> $GITHUB_ENV

      - name: 1c. Typecheck (ty)
        working-directory: backend
        run: |
          uv run ty check > ../reports/ty.txt 2>&1 || echo "typecheck_failed=true" >> $GITHUB_ENV

      - name: 2. Unit Tests (Pytest)
        working-directory: backend
        run: |
          uv run pytest --junitxml=../reports/junit.xml || echo "test_failed=true" >> $GITHUB_ENV

      - name: Upload Quality & Test Reports Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-test-and-lint-reports
          path: reports/
          retention-days: 14

      - name: Enforce Check Statuses
        run: |
          FAILED=0
          if [ "$format_failed" = "true" ]; then
            echo "::error::Ruff formatting check failed."
            FAILED=1
          fi
          if [ "$lint_failed" = "true" ]; then
            echo "::error::Ruff linting check failed."
            FAILED=1
          fi
          if [ "$typecheck_failed" = "true" ]; then
            echo "::error::Ty type check failed."
            FAILED=1
          fi
          if [ "$test_failed" = "true" ]; then
            echo "::error::Pytest unit test suite failed."
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo "Pipeline failed quality gates. Inspect the 'ci-test-and-lint-reports' artifact for failure details."
            exit 1
          fi

      - name: 3. Build Docker Image (BuildKit)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Set to true when pushing to a container registry (ECR, Docker Hub, Render)
          tags: ci-cd-fastapi:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 4. Deploy to Prod-like Environment (Render / AWS Example)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          # Security practice: Injecting secrets securely from GitHub Secrets (automatically masked in logs)
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "Deploying to prod-like environment..."
          
          # Example A: Render deployment via Webhook or API
          # curl -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
          #   -H "Authorization: Bearer $RENDER_API_KEY"
          
          # Example B: AWS Free Tier deployment (ECS / EC2 SSH / Elastic Beanstalk)
          # aws ecs update-service --cluster my-cluster --service my-service --force-new-deployment
          
          echo "Deployment pipeline completed successfully!"
